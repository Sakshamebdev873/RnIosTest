name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild \
            -workspace RnIosTest.xcworkspace \
            -scheme RnIosTest \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Zip the iOS App
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r RnIosTest.zip RnIosTest.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RnIosTest-Appetize
          path: ios/build/Build/Products/Release-iphonesimulator/RnIosTest.zip
