name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node dependencies
        run: npm install

      - name: Create .env File
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Inject API Key
        run: node scripts/inject-api-key.js

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild \
            -workspace RnIosTest.xcworkspace \
            -scheme RnIosTest \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Zip the iOS App
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r RnIosTest.zip RnIosTest.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RnIosTest-Appetize
          path: ios/build/Build/Products/Debug-iphonesimulator/RnIosTest.zip
